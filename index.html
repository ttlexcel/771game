<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>난사데이</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap');
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
    --purple:#d4baff; --purple-mid:#b898f8; --purple-dark:#9370db;
    --bg:#2e2550; --surface:#3d3268; --surface2:#4a3d7a;
    --border:rgba(212,186,255,0.35); --border-bright:rgba(212,186,255,0.7);
    --text:#faf6ff; --text-muted:#c4b4e8;
    --red:#ff6b74; --red-bg:#4a1520; --red-border:rgba(255,107,116,0.5);
    --orange:#ffaa44; --orange-bg:#3a2000; --orange-border:rgba(255,170,68,0.5);
    --green:#4cdb8a; --green-bg:#0d3320; --green-border:rgba(76,219,138,0.5);
}
body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px; }

/* 헤더 */
.header { text-align:center; padding:24px 0 20px; }
.header img.logo { height:80px; object-fit:contain; filter:drop-shadow(0 0 18px rgba(180,150,255,0.5)); }
.header h1 { font-size:13px; font-weight:600; color:var(--text-muted); letter-spacing:4px; text-transform:uppercase; margin-top:8px; }

/* 설정 패널 */
.panel { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; max-width:680px; margin:0 auto 24px; }
.panel-title { font-size:16px; font-weight:700; color:var(--purple); letter-spacing:1px; margin-bottom:16px; }
label { display:block; font-size:12px; font-weight:600; color:var(--text-muted); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px; }
input[type="number"], input[type="text"] { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:14px; font-family:inherit; color:var(--text); transition:border-color 0.2s; }
input:focus { outline:none; border-color:var(--border-bright); }

/* 무기 설정 행 */
.weapon-row { display:grid; grid-template-columns:2fr 1.5fr 1.5fr auto; gap:10px; margin-bottom:10px; align-items:center; }
.weapon-row input { margin:0; }

.btn { display:block; width:100%; padding:12px; background:var(--purple-dark); border:1px solid var(--purple-mid); border-radius:10px; color:#fff; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; transition:background 0.2s,box-shadow 0.2s; letter-spacing:1px; }
.btn:hover { background:var(--purple-mid); box-shadow:0 0 20px rgba(139,110,224,0.4); }
.btn-sm { padding:8px 14px; border-radius:8px; font-size:13px; width:auto; display:inline-block; }
.btn-danger { background:var(--red-bg); border-color:var(--red); color:var(--red); }
.btn-danger:hover { background:var(--red); color:#fff; }
.btn-success { background:var(--green-bg); border-color:var(--green); color:var(--green); }
.btn-success:hover { background:var(--green); color:#000; }
.btn-warning { background:var(--orange-bg); border-color:var(--orange); color:var(--orange); }
.btn-warning:hover { background:var(--orange); color:#000; }

.btn-icon { background:var(--red-bg); border:1px solid var(--red-border); border-radius:6px; color:var(--red); padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; transition:background 0.2s; }
.btn-icon:hover { background:var(--red); color:#fff; }
.divider { height:1px; background:var(--border); margin:20px 0; }

.member-status { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 16px; margin:16px 0; font-size:13px; color:var(--text-muted); text-align:center; }
.member-status.ok { color:var(--green); border-color:var(--green-border); }
.member-status.err { color:var(--orange); border-color:var(--orange-border); }

.obs-link-row { display:flex; gap:8px; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 14px; margin-top:4px; }
.obs-link-display { flex:1; font-size:12px; color:var(--text-muted); word-break:break-all; font-family:monospace; }
.btn-copy { background:var(--surface2); border:1px solid var(--border-bright); border-radius:8px; color:var(--purple); white-space:nowrap; padding:8px 14px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; width:auto; }
.btn-copy:hover { background:var(--purple-dark); color:#fff; }
.btn-copy.copied { background:#1a6b45; border-color:#2ecc71; color:#2ecc71; }

/* 게임 보드 */
.game-board { display:none; }
.game-board.active { display:block; max-width:1400px; margin:0 auto; }

.game-topbar { display:flex; gap:10px; margin-bottom:14px; align-items:center; flex-wrap:wrap; }
.sync-status { font-size:11px; color:var(--text-muted); margin-left:auto; }
.sync-status.ok { color:var(--green); }
.sync-status.err { color:var(--red); }

/* 표(Table) 스타일 형태의 세로 그리드 레이아웃 개선 */
.members-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
.member-table-header { display: grid; grid-template-columns: 140px 120px 110px 110px 1fr; gap: 12px; padding: 0 12px 10px; border-bottom: 2px solid var(--border); font-size: 13px; font-weight: 700; color: var(--purple); text-align: center; }
.member-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 520px; overflow-y: auto; padding-right: 4px; }

.member-card { display: grid; grid-template-columns: 140px 120px 110px 110px 1fr; gap: 12px; align-items: center; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 12px; transition:border-color 0.2s, box-shadow 0.2s; }
.member-card:hover { border-color:var(--border-bright); background: rgba(255,255,255,0.02); }
.member-card.flabs-updated { border-color:var(--green) !important; box-shadow:0 0 12px rgba(76,219,138,0.4); }

.member-name { font-size:13px; font-weight:700; color:#fff; padding:6px; background:var(--surface2); border:1px solid rgba(212,186,255,0.2); border-radius:6px; text-align:center; word-break:keep-all; }

.total-info { text-align:center; background: rgba(147,112,219,0.15); border: 1px solid rgba(147,112,219,0.3); padding: 6px; border-radius: 6px; }
.total-value { font-size:14px; font-weight:900; color:var(--purple); }

.finance-cell { font-size: 14px; font-weight: 900; text-align: center; padding: 6px; border-radius: 6px; color: #fff; }
.finance-cell.prize { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green); }
.finance-cell.penalty { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red); }

.weapon-list-inline { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: flex-start; padding-left: 6px; }
.weapon-badge { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; display: flex; gap: 6px; align-items: center; font-size: 12px; }
.weapon-badge-name { color: var(--text-muted); font-weight: 600; }
.weapon-badge-count { color: #fff; font-weight: 900; background: var(--purple-dark); padding: 1px 5px; border-radius: 4px; transition:transform 0.15s; }
.weapon-badge-count.bump { transform:scale(1.25); color: var(--orange); }

/* 컨트롤 패널 구조 */
.control-panel { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:14px; margin-bottom: 14px; }
.control-box { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; display: flex; flex-direction: column; justify-content: space-between; }
.control-box h3 { font-size:12px; font-weight:700; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; border-left: 3px solid var(--purple-mid); padding-left: 6px; }
.control-inputs { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
.input-group { display:flex; flex-direction:column; gap:4px; }
.input-group label { font-size:10px; font-weight: 600; color: var(--text-muted); }
.ctrl-select { background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:7px 10px; font-size:13px; font-weight:600; font-family:inherit; color:var(--text); cursor:pointer; min-width:110px; }
.ctrl-select:focus { outline:none; border-color:var(--border-bright); }
.ctrl-num { width:80px; text-align:center; font-size:14px; font-weight:700; }
.current-count { background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:7px 12px; font-size:15px; font-weight:900; color:var(--purple); text-align:center; min-width:60px; }

/* 발사 로그창 스타일 */
.log-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.log-list { max-height: 160px; overflow-y: auto; background: var(--bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
.log-item { line-height: 1.5; border-bottom: 1px solid rgba(212,186,255,0.08); padding-bottom: 4px; color: var(--text-muted); }
.log-time { color: rgba(255,255,255,0.4); font-family: monospace; margin-right: 4px; }
.txt-p { color: var(--purple); font-weight: 700; }
.txt-g { color: var(--green); font-weight: 700; }
.txt-r { color: var(--red); font-weight: 700; }
.txt-o { color: var(--orange); font-weight: 700; }
.log-highlight { color: #fff; font-weight: 800; background: rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 4px; margin: 0 2px; }
</style>
</head>
<body>

<div class="header">
    <img src="771_logo.png" class="logo" alt="FantaJ">
    <h1>난사데이</h1>
</div>

<div class="panel" id="settingsPanel">
    <div class="panel-title">무기 설정</div>
    <div style="display:grid;grid-template-columns:2fr 1.5fr 1.5fr auto;gap:10px;margin-bottom:8px;">
        <label>무기 이름</label><label>갯수</label><label>벌금 (원)</label><span></span>
    </div>
    <div id="weaponInputs">
        <div class="weapon-row">
            <input type="text" class="weapon-name" placeholder="무기 이름" value="총">
            <input type="number" class="weapon-count" placeholder="갯수" value="10000">
            <input type="number" class="weapon-penalty" placeholder="벌금" value="10000">
            <button class="btn-icon" onclick="removeWeaponRow(this)">삭제</button>
        </div>
    </div>
    <button class="btn btn-sm" onclick="addWeaponRow()" style="margin-top:10px;width:100%;">+ 무기 추가</button>

    <div class="divider"></div>

    <div id="memberStatus" class="member-status">멤버 로딩 중...</div>

    <div style="margin-bottom:16px;">
        <label>OBS 브라우저 주소</label>
        <div class="obs-link-row">
            <div class="obs-link-display" id="obsLinkDisplay">—</div>
            <button class="btn-copy" id="copyObsBtn" onclick="copyObsLink()">복사</button>
        </div>
    </div>

    <button class="btn" onclick="startGame()">▶ 게임 시작</button>
</div>

<div class="game-board" id="gameBoard">
    <div class="game-topbar">
        <button class="btn btn-sm btn-danger" onclick="resetGame()">설정으로</button>
        <button class="btn btn-sm" onclick="loadLastGame()">마지막 게임 불러오기</button>
        <button class="btn btn-sm btn-success" id="flabsToggleBtn" onclick="toggleFlabsAuto()">🔗 flabs 자동 반영</button>
        <div class="sync-status" id="flabsStatus">flabs 연동 대기 중...</div>
        <div class="sync-status" id="syncStatus">OBS 대기 중...</div>
    </div>

    <div class="members-wrap">
        <div class="member-table-header">
            <div>멤버 이름</div>
            <div>기여도 누적</div>
            <div>누적 상금</div>
            <div>누적 벌금</div>
            <div>소유 무기 현황</div>
        </div>
        <div class="member-grid" id="memberGrid"></div>
    </div>

    <div class="control-panel">
        
        <div class="control-box" style="border-color: var(--purple-mid); grid-column: span 2;">
            <h3>🔫 발사 제어</h3>
            <div class="control-inputs">
                <div class="input-group">
                    <label>발사자 (상금획득)</label>
                    <select id="shooterSelect" class="ctrl-select"></select>
                </div>
                <div class="input-group">
                    <label>맞은 사람 (벌금부과)</label>
                    <select id="targetSelect" class="ctrl-select"></select>
                </div>
                <div class="input-group">
                    <label>발사 수</label>
                    <input type="number" id="actionShots" class="ctrl-num" value="1" min="1" style="width:60px;">
                </div>
                <div class="input-group">
                    <label>1발당 상금(만)</label>
                    <input type="number" id="actionPrizePerShot" class="ctrl-num" value="10" min="0" style="width:75px;">
                </div>
                <div class="input-group">
                    <label>1발당 벌금(만)</label>
                    <input type="number" id="actionPenaltyPerShot" class="ctrl-num" value="10" min="0" style="width:75px;">
                </div>
                <div class="input-group">
                    <label>1발당 차감 기여도</label>
                    <input type="number" id="deductPointsPerShot" class="ctrl-num" value="10000" min="0" style="width:95px;">
                </div>
                <button class="btn btn-sm btn-success" onclick="fireShotAction()" style="padding: 8px 18px; font-size:14px;">탕! 발사</button>
            </div>
        </div>

        <div class="control-box">
            <h3>기여도 추가</h3>
            <div class="control-inputs">
                <div class="input-group">
                    <label>멤버</label>
                    <select id="memberSelectAdd" class="ctrl-select"></select>
                </div>
                <div class="input-group">
                    <label>기여도</label>
                    <input type="number" id="pointsInput" class="ctrl-num" placeholder="숫자" min="0">
                </div>
                <button class="btn btn-sm btn-success" onclick="addPointsFromControl()">+ 추가</button>
            </div>
        </div>

        <div class="control-box">
            <h3>↩ 기여도 취소</h3>
            <div class="control-inputs">
                <div class="input-group">
                    <label>멤버</label>
                    <select id="memberSelectMinus" class="ctrl-select"></select>
                </div>
                <div class="input-group">
                    <label>취소량</label>
                    <input type="number" id="minusInput" class="ctrl-num" placeholder="숫자" min="0">
                </div>
                <button class="btn btn-sm btn-warning" onclick="subtractPointsFromControl()">− 취소</button>
            </div>
        </div>

        <div class="control-box">
            <h3>무기 감소</h3>
            <div class="control-inputs">
                <div class="input-group">
                    <label>멤버</label>
                    <select id="memberSelectRemove" class="ctrl-select" onchange="updateCurrentWeaponCount()"></select>
                </div>
                <div class="input-group">
                    <label>무기</label>
                    <select id="weaponSelect" class="ctrl-select" onchange="updateCurrentWeaponCount()"></select>
                </div>
                <div class="input-group">
                    <label>보유</label>
                    <div class="current-count" id="currentWeaponCount">0</div>
                </div>
                <button class="btn btn-sm btn-danger" onclick="removeWeaponFromControl()">- 감소</button>
            </div>
        </div>
    </div>

    <div class="log-box">
        <h3>📋 발사 로그</h3>
        <div class="log-list" id="logList"></div>
    </div>
</div>

<script>
let weapons       = [];
let members       = [];
let memberWeapons = {};
let gameLogs      = [];

// ── 초기화 ────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
    await loadMembers();
    const obsUrl = location.href.replace(/\/[^\/]*$/, '/nansa_obs.html');
    document.getElementById('obsLinkDisplay').textContent = obsUrl;
});

// ── 멤버 로딩 연동 (flabs 파싱 최우선 순위 처리) ─────────────────────
async function loadMembers() {
    const el = document.getElementById('memberStatus');
    
    // 1단계: flabs 연동 데이터의 구조를 파싱하여 키값으로 연동 시도
    try {
        const r = await fetch('flabs_poller.php');
        if (r.ok) {
            const d = await r.json();
            if (d.success && d.current && Object.keys(d.current).length > 0) {
                members = Object.keys(d.current);
                el.textContent = `✅ flabs 연동 규격 기반 ${members.length}명 추출 성공`;
                el.className = 'member-status ok';
                return;
            }
        }
    } catch(e) { /* 404 에러 시 다음 단계 우회 */ }

    // 2단계: 기존 순서 백업 JSON 로드 시도
    try {
        const r = await fetch('../../cignatureV2/member_order.json');
        if (r.ok) {
            members = await r.json();
            el.textContent = `✅ 백업 파일 기준 ${members.length}명 멤버 로드 완료`;
            el.className = 'member-status ok';
            return;
        }
    } catch(e) { /* 404 에러 시 다음 단계 우회 */ }

    // 3단계: 둘 다 실패(404 등)할 경우 자체 배열 실행 (인터럽트 방어)
    el.textContent = '⚠️ flabs/백업 로드 오류 — 자체 예비 멤버 배열로 구동';
    el.className = 'member-status err';
    members = ["[부장] 예란","[차장] 채보미","[과장] 이아린","[팀장] 푸글리","[비서] 미래",
               "[대리] 짐광환","[사원] 이리원","[선임] 파닥","[주임] 이나율","[인턴] 김그루",
               "[신입] 나래","[지배인] 김대봉","[웨이터] 짖음","[웨이터] 아늑"];
}

// ── OBS 링크 복사 ──────────────────────────────────
function copyObsLink() {
    const url = document.getElementById('obsLinkDisplay').textContent;
    const btn = document.getElementById('copyObsBtn');
    const done = () => {
        btn.textContent = '복사됨 ✓'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2000);
    };
    navigator.clipboard.writeText(url).then(done).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
        document.body.removeChild(ta); done();
    });
}

// ── 무기 인풋 행 제어 ────────────────────────────────
function addWeaponRow() {
    const row = document.createElement('div');
    row.className = 'weapon-row';
    row.innerHTML = `
        <input type="text" class="weapon-name" placeholder="무기 이름">
        <input type="number" class="weapon-count" placeholder="갯수">
        <input type="number" class="weapon-penalty" placeholder="벌금">
        <button class="btn-icon" onclick="removeWeaponRow(this)">삭제</button>`;
    document.getElementById('weaponInputs').appendChild(row);
}
function removeWeaponRow(btn) { btn.parentElement.remove(); }

// ── 게임 시작 버튼 트리거 ──────────────────────────────
function startGame() {
    if (!members.length) { alert('멤버 데이터를 준비 중입니다.'); return; }

    weapons = [];
    document.querySelectorAll('.weapon-row').forEach(row => {
        const name    = row.querySelector('.weapon-name').value.trim();
        const count   = parseInt(row.querySelector('.weapon-count').value);
        const penalty = parseInt(row.querySelector('.weapon-penalty').value);
        if (name && count > 0 && penalty >= 0) weapons.push({ name, count, penalty });
    });
    weapons.sort((a, b) => b.count - a.count);
    if (!weapons.length) { alert('최소 1개 이상의 무기를 설정해 주세요.'); return; }

    memberWeapons = {};
    members.forEach(m => {
        memberWeapons[m] = { total: 0, weapons: {}, prize: 0, penalty: 0 };
        weapons.forEach(w => { memberWeapons[m].weapons[w.name] = 0; });
    });

    document.getElementById('settingsPanel').style.display = 'none';
    document.getElementById('gameBoard').classList.add('active');

    renderMemberCards();
    setupEnterKey();

    // 로그 복원 초기화
    gameLogs = [];
    document.getElementById('logList').innerHTML = '';
    const savedLogs = localStorage.getItem('난사데이_발사로그');
    if (savedLogs) {
        gameLogs = JSON.parse(savedLogs);
        rebuildLogsUI();
    }

    const saved = localStorage.getItem('난사데이_게임상태');
    if (saved && confirm('저장된 데이터가 있습니다. 이어하시겠습니까?')) {
        loadGameState(JSON.parse(saved));
    }
    syncState();
}

// ── 가로 테이블 구조 형식의 명단 출력 ─────────────────────────
function renderMemberCards() {
    const grid = document.getElementById('memberGrid');
    grid.innerHTML = '';
    members.forEach(m => grid.appendChild(createMemberRow(m)));
    updateMemberSelect();
}

function createMemberRow(member) {
    const row = document.createElement('div');
    row.className = 'member-card';
    row.id = `card-${member}`;

    // 1열: 이름
    const name = document.createElement('div');
    name.className = 'member-name';
    name.textContent = member;
    row.appendChild(name);

    // 2열: 기여도
    const total = document.createElement('div');
    total.className = 'total-info';
    total.innerHTML = `<div class="total-value" id="${member}-total">0</div>`;
    row.appendChild(total);

    // 3열: 누적 상금
    const prize = document.createElement('div');
    prize.className = 'finance-cell prize';
    prize.id = `${member}-prize`;
    prize.textContent = '0만';
    row.appendChild(prize);

    // 4열: 누적 벌금
    const penalty = document.createElement('div');
    penalty.className = 'finance-cell penalty';
    penalty.id = `${member}-penalty`;
    penalty.textContent = '0만';
    row.appendChild(penalty);

    // 5열: 소유 무기 가로 리스트
    const weaponWrap = document.createElement('div');
    weaponWrap.className = 'weapon-list-inline';
    weapons.forEach(w => {
        const badge = document.createElement('div');
        badge.className = 'weapon-badge';
        badge.innerHTML = `
            <span class="weapon-badge-name">${w.name}</span>
            <span class="weapon-badge-count" id="${member}-${w.name}-count">0</span>`;
        weaponWrap.appendChild(badge);
    });
    row.appendChild(weaponWrap);

    return row;
}

function updateMemberSelect() {
    ['memberSelectAdd','memberSelectMinus','memberSelectRemove', 'shooterSelect', 'targetSelect'].forEach(id => {
        const sel = document.getElementById(id);
        if(!sel) return;
        sel.innerHTML = '';
        members.forEach(m => {
            const o = document.createElement('option');
            o.value = m; o.textContent = m;
            sel.appendChild(o);
        });
    });
    const ws = document.getElementById('weaponSelect');
    ws.innerHTML = '';
    weapons.forEach(w => {
        const o = document.createElement('option');
        o.value = w.name; o.textContent = w.name;
        ws.appendChild(o);
    });
    updateCurrentWeaponCount();
}

// ── 다중 발사 및 기여도 차감 제어 처리 액션 ────────────────────
function fireShotAction() {
    const shooter        = document.getElementById('shooterSelect').value;
    const target         = document.getElementById('targetSelect').value;
    const shots          = parseInt(document.getElementById('actionShots').value) || 0;
    const prizePerShot   = parseInt(document.getElementById('actionPrizePerShot').value) || 0;
    const penaltyPerShot = parseInt(document.getElementById('actionPenaltyPerShot').value) || 0;
    const deductPerShot  = parseInt(document.getElementById('deductPointsPerShot').value) || 0;

    if (!shooter || !target) { alert('발사자와 맞은 대상을 정확히 지정해 주세요.'); return; }
    if (shots <= 0) { alert('최소 1발 이상 발사해야 합니다.'); return; }

    const totalPrize   = shots * prizePerShot;
    const totalPenalty = shots * penaltyPerShot;
    const totalDeduct  = shots * deductPerShot;

    // 1. 발사자 상금 획득 및 기여도 차감
    if (memberWeapons[shooter]) {
        memberWeapons[shooter].prize += totalPrize;
        // 기여도 차감 처리 (최하 0점 방어)
        memberWeapons[shooter].total = Math.max(0, memberWeapons[shooter].total - totalDeduct);
        
        // 차감된 기여도로 무기 개수 실시간 재연동 계산
        const conv = convertPointsToWeapons(memberWeapons[shooter].total);
        weapons.forEach(w => {
            memberWeapons[shooter].weapons[w.name] = conv.weapons[w.name] || 0;
        });
        
        updateMemberDisplay(shooter);
        triggerVisualEffect(shooter);
    }

    // 2. 맞은 사람 벌금 부과
    if (memberWeapons[target]) {
        memberWeapons[target].penalty += totalPenalty;
        updateMemberDisplay(target);
        triggerVisualEffect(target);
    }

    // 3. 로그창에 기록 생성 및 렌더링
    pushLaunchLog(shooter, target, shots, totalPrize, totalPenalty, totalDeduct);

    autoSaveGame();
    syncState();
}

// ── 로그 관리 및 화면 추가 ───────────────────────────
function pushLaunchLog(shooter, target, shots, prize, penalty, deduct) {
    const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
    const logObj = { time, shooter, target, shots, prize, penalty, deduct };
    gameLogs.unshift(logObj); // 최신로그가 항상 위로 가도록 처리
    if(gameLogs.length > 100) gameLogs.pop(); // 최대 버퍼 100개 제한

    localStorage.setItem('난사데이_발사로그', JSON.stringify(gameLogs));
    renderSingleLogUI(logObj);
}

function renderSingleLogUI(log) {
    const list = document.getElementById('logList');
    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `
        <span class="log-time">[${log.time}]</span> 
        <span class="txt-p">${log.shooter}</span> ➔ <span class="txt-r">${log.target}</span> 
        <span class="log-highlight">${log.shots}발 발사</span> | 
        상금 <span class="txt-g">+${log.prize}만</span> / 
        벌금 <span class="txt-r">+${log.penalty}만</span> | 
        기여도 <span class="txt-o">-${log.deduct.toLocaleString()}</span> 차감`;
    list.insertBefore(item, list.firstChild);
}

function rebuildLogsUI() {
    const list = document.getElementById('logList');
    list.innerHTML = '';
    // 순차 역순 배열 렌더링
    for(let i = gameLogs.length - 1; i >= 0; i--) {
        renderSingleLogUI(gameLogs[i]);
    }
}

function triggerVisualEffect(member) {
    const card = document.getElementById(`card-${member}`);
    if (card) {
        card.classList.add('flabs-updated');
        setTimeout(() => card.classList.remove('flabs-updated'), 1000);
    }
}

// ── 기여도 가산 제어 (수동 UI) ───────────────────────
function addPointsFromControl() {
    const member = document.getElementById('memberSelectAdd').value;
    const points = parseInt(document.getElementById('pointsInput').value);
    if (!member) { alert('멤버를 선택해주세요.'); return; }
    if (isNaN(points) || points <= 0) { alert('올바른 숫자를 입력해주세요.'); return; }

    applyPoints(member, points);
    document.getElementById('pointsInput').value = '';
    document.getElementById('pointsInput').focus();
}

// ── 기여도 감산 취소 (수동 UI) ───────────────────────
function subtractPointsFromControl() {
    const member = document.getElementById('memberSelectMinus').value;
    const points = parseInt(document.getElementById('minusInput').value);
    if (!member) { alert('멤버를 선택해주세요.'); return; }
    if (isNaN(points) || points <= 0) { alert('올바른 숫자를 입력해주세요.'); return; }

    const current = memberWeapons[member].total;
    const next    = Math.max(0, current - points);
    const diff    = current - next;
    if (diff === 0) { alert('이미 기여도가 0입니다.'); return; }

    applyPoints(member, -diff);
    document.getElementById('minusInput').value = '';
    document.getElementById('minusInput').focus();
}

// ── 기여도 변동 연동 공용 로직 ─────────────────────────
function applyPoints(member, points) {
    if (!memberWeapons[member]) return;

    memberWeapons[member].total += points;
    const conv = convertPointsToWeapons(memberWeapons[member].total);
    weapons.forEach(w => {
        memberWeapons[member].weapons[w.name] = conv.weapons[w.name] || 0;
    });

    updateMemberDisplay(member);
    updateCurrentWeaponCount();
    autoSaveGame();
    syncState();
}

function convertPointsToWeapons(points) {
    const result = {}; let remaining = points;
    for (const w of weapons) {
        const n = Math.floor(remaining / w.count);
        if (n > 0) { result[w.name] = n; remaining -= n * w.count; }
    }
    return { weapons: result, remaining };
}

// ── 수동 무기 감소 제어 ──────────────────────────────
function removeWeaponFromControl() {
    const member     = document.getElementById('memberSelectRemove').value;
    const weaponName = document.getElementById('weaponSelect').value;
    if (!member || !weaponName) { alert('멤버와 무기를 지정해 주세요.'); return; }
    
    if ((memberWeapons[member].weapons[weaponName] || 0) <= 0) return;
    memberWeapons[member].weapons[weaponName]--;
    
    const w = weapons.find(x => x.name === weaponName);
    if (w) memberWeapons[member].total -= w.count;
    
    updateMemberDisplay(member);
    updateCurrentWeaponCount();
    autoSaveGame();
    syncState();
}

function updateCurrentWeaponCount() {
    const member = document.getElementById('memberSelectRemove').value;
    const wname  = document.getElementById('weaponSelect').value;
    const el     = document.getElementById('currentWeaponCount');
    el.textContent = (member && wname && memberWeapons[member])
        ? (memberWeapons[member].weapons[wname] || 0) : 0;
}

// ── 데이터 디스플레이 동기화 ───────────────────────────
function updateMemberDisplay(member) {
    if (!memberWeapons[member]) return;
    
    weapons.forEach(w => {
        const el = document.getElementById(`${member}-${w.name}-count`);
        if (!el) return;
        const currentVal = memberWeapons[member].weapons[w.name] || 0;
        
        if(el.textContent != currentVal) {
            el.textContent = currentVal;
            el.classList.add('bump');
            setTimeout(() => el.classList.remove('bump'), 200);
        }
    });

    const te = document.getElementById(`${member}-total`);
    if (te) te.textContent = memberWeapons[member].total.toLocaleString();

    const pr = document.getElementById(`${member}-prize`);
    if (pr) pr.textContent = (memberWeapons[member].prize || 0) + '만';

    const pe = document.getElementById(`${member}-penalty`);
    if (pe) pe.textContent = (memberWeapons[member].penalty || 0) + '만';
}

// ── 상태 백업 세이브/레이아웃 복원 ───────────────────────
function autoSaveGame() {
    localStorage.setItem('난사데이_게임상태', JSON.stringify({
        weapons, members, memberWeapons, timestamp: new Date().toISOString()
    }));
}

function loadLastGame() {
    const saved = localStorage.getItem('난사데이_게임상태');
    if (!saved) { alert('저장된 게임 상태가 발견되지 않았습니다.'); return; }
    try {
        loadGameState(JSON.parse(saved));
        alert('이전 게임의 점수판과 현황을 안전하게 불러왔습니다!');
    } catch(e) { alert('불러오기 파싱 실패.'); }
}

function loadGameState(state) {
    weapons       = state.weapons;
    members       = state.members;
    memberWeapons = state.memberWeapons;
    
    // 이전 세이브 하위 호환 구조 누락 속성 안전 보정
    for (const m in memberWeapons) {
        if (memberWeapons[m].prize === undefined) memberWeapons[m].prize = 0;
        if (memberWeapons[m].penalty === undefined) memberWeapons[m].penalty = 0;
    }
    
    renderMemberCards();
    members.forEach(m => updateMemberDisplay(m));
    syncState();
}

function resetGame() {
    if(!confirm('정말 게임을 초기화하고 설정창으로 돌아가시겠습니까?')) return;
    document.getElementById('settingsPanel').style.display = '';
    document.getElementById('gameBoard').classList.remove('active');
    weapons = []; memberWeapons = {}; gameLogs = [];
    localStorage.removeItem('난사데이_발사로그');
    document.getElementById('logList').innerHTML = '';
    fetch('save_nansa_state.php', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ gameActive: false })
    }).catch(()=>{});
}

function setupEnterKey() {
    const inp = document.getElementById('pointsInput');
    if (inp) inp.addEventListener('keypress', e => { if (e.key === 'Enter') addPointsFromControl(); });
    const min = document.getElementById('minusInput');
    if (min) min.addEventListener('keypress', e => { if (e.key === 'Enter') subtractPointsFromControl(); });
}

// ── flabs 자동 연동 분기 처리 ───────────────────────
let flabsPollTimer   = null;
let flabsAutoEnabled = false;
let flabsPrevData    = {};

function extractPureName(str) {
    return str.replace(/\[[^\]]*\]/g, '').replace(/\s/g, '');
}

function findMemberByFlabsName(flabsName) {
    const fPure = extractPureName(flabsName);
    if (!fPure) return null;
    return members.find(m => extractPureName(m) === fPure) || null;
}

async function pollFlabs() {
    try {
        const r = await fetch('flabs_poller.php');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        if (!d.success) throw new Error(d.error || 'JSON 파싱 실패');

        const current = d.current || {};
        let applied = 0;

        for (const [flabsName, points] of Object.entries(current)) {
            const prev  = flabsPrevData[flabsName] ?? 0;
            const delta = points - prev;
            if (delta <= 0) continue;

            const member = findMemberByFlabsName(flabsName);
            if (!member || !memberWeapons[member]) continue;

            applyPoints(member, delta);
            flabsPrevData[flabsName] = points;
            applied++;

            triggerVisualEffect(member);
        }

        const el = document.getElementById('flabsStatus');
        if (el) {
            el.textContent = applied > 0
                ? `✅ flabs 자동 반영 (${applied}명) — ${new Date().toLocaleTimeString('ko-KR')}`
                : `⏳ flabs 연동 탐색 중 — ${new Date().toLocaleTimeString('ko-KR')}`;
            el.className = 'sync-status ok';
        }
    } catch(e) {
        const el = document.getElementById('flabsStatus');
        if (el) { el.textContent = `❌ flabs 대기 처리: ${e.message}`; el.className = 'sync-status err'; }
    }
}

function toggleFlabsAuto() {
    flabsAutoEnabled = !flabsAutoEnabled;
    const btn = document.getElementById('flabsToggleBtn');
    if (flabsAutoEnabled) {
        flabsPrevData = {};
        pollFlabs();
        flabsPollTimer = setInterval(pollFlabs, 3000);
        if (btn) { btn.textContent = '⏹ flabs 중지'; btn.className = 'btn btn-sm btn-danger'; }
    } else {
        clearInterval(flabsPollTimer);
        flabsPollTimer = null;
        flabsPrevData  = {};
        if (btn) { btn.textContent = '🔗 flabs 자동 반영'; btn.className = 'btn btn-sm btn-success'; }
        const el = document.getElementById('flabsStatus');
        if (el) { el.textContent = 'flabs 연동 중지됨'; el.className = 'sync-status'; }
    }
}

// ── OBS 방송 화면용 저장소 실시간 동기화 ────────────────────────
async function syncState() {
    const payload = {
        gameActive: true,
        weapons,
        members,
        memberWeapons,
        updatedAt: Date.now()
    };
    try {
        const r = await fetch('save_nansa_state.php', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        });
        const d  = await r.json();
        const el = document.getElementById('syncStatus');
        if (d && d.success) {
            el.textContent = `OBS 동기화 완결 — ${new Date().toLocaleTimeString('ko-KR')}`;
            el.className = 'sync-status ok';
        } else {
            el.textContent = '동기화 통신 대기'; el.className = 'sync-status err';
        }
    } catch(e) {
        const el = document.getElementById('syncStatus');
        el.textContent = '로컬 브로드캐스트 대기'; el.className = 'sync-status err';
    }
}
